services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ARTIFACTS_DIR: /app/artifacts
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PORT: "8000"
    volumes:
      - ./backend/artifacts:/app/artifacts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Not started by default `docker compose up`. Run explicitly to (re)generate
  # the artifacts/ directory that `backend` reads from:
  #   docker compose run --rm pipeline
  #   docker compose run --rm pipeline python -m pipeline.cli train --model ncf
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    volumes:
      - ./data:/app/data
      # pipeline/config.py resolves ARTIFACTS_DIR to <repo_root>/backend/artifacts,
      # and ROOT_DIR is /app inside this container -- mount to match.
      - ./backend/artifacts:/app/backend/artifacts
    profiles: ["pipeline"]
